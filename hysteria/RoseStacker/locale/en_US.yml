# Plugin Message Prefix
prefix: ''

# Stack Display Tags
entity-stack-display: '<g:#FFAA00:#FF4500>%amount%x &f%name%'
entity-stack-display-custom-name: '%name% <g:#FFAA00:#FF4500>%amount%x'
entity-stack-display-spawn-egg: '<g:#FFAA00:#FF4500>%amount%x &f%name% Spawn Egg'
item-stack-display: '<g:#FFAA00:#FF4500>%amount%x &f%name%'
item-stack-display-single: '&f%name%'
block-stack-display: '<g:#FFAA00:#FF4500>%amount%x &f%name%'
spawner-stack-display: '<g:#FFAA00:#FF4500>%amount%x &f%name%'
spawner-stack-display-single: '&f%name%'

# Hologram Display Tags
# Available spawner placeholders: %name%, %amount%, %max_amount%, %time_remaining%, %ticks_remaining%, %total_spawned%
# Multiple lines are supported
block-hologram-display:
  - '<g:#FFAA00:#FF4500>%amount%x &f%name%'
spawner-hologram-display:
  - '<g:#FFAA00:#FF4500>%amount%x &f%name%'
spawner-hologram-display-single:
  - '&f%name%'
spawner-hologram-display-empty:
  - '<g:#FFAA00:#FF4500>%amount%x &f%name%'
spawner-hologram-display-empty-single:
  - '&f%name%'

# Base Command Message
base-command-color: '&#FFB347'
base-command-help: '<g:#FFD27A:#FF8C1A>Use <g:#FFAA00:#FF4500>/%cmd% help <g:#FFD27A:#FF8C1A>to see the commands.'

# Help Command
command-help-description: 'Shows the help menu'
command-help-title: '<g:#FFAA00:#FF4500>Stacker commands'
command-help-list-description: '<g:#FFD27A:#FF8C1A>» <g:#FFAA00:#FF4500>/%cmd% %subcmd% &f%args%<g:#FFD27A:#FF8C1A>: %desc%'
command-help-list-description-no-args: '<g:#FFD27A:#FF8C1A>» <g:#FFAA00:#FF4500>/%cmd% %subcmd%<g:#FFD27A:#FF8C1A>: %desc%'

# Reload Command
command-reload-description: 'Reloads the plugin'
command-reload-reloaded: '&#55FF55Plugin data, config and locale files reloaded.'

# Give Command
command-give-description: 'Gives pre-stacked items'
command-give-usage: '<g:#FFD27A:#FF8C1A>Usage: <g:#FFAA00:#FF4500>/rs give &f<block|spawner|entity> <player> <type> [stackSize] [amount]'
command-give-given: '<g:#FFD27A:#FF8C1A>You gave &f%display% <g:#FFD27A:#FF8C1A>to &f%player%<g:#FFD27A:#FF8C1A>.'
command-give-given-multiple: '<g:#FFD27A:#FF8C1A>You gave &f%amount%x %display% <g:#FFD27A:#FF8C1A>to &f%player%<g:#FFD27A:#FF8C1A>.'
command-give-unstackable: '&#FF5555This type does not stack. Use a stackable type.'
command-give-too-large: '&#FF5555This amount is above the max stack size for this type.'

# Clearall Command
command-clearall-description: 'Clears all stacks of one type'
command-clearall-killed-entities: '<g:#FFD27A:#FF8C1A>Cleared &f%amount% <g:#FFD27A:#FF8C1A>entity stacks.'
command-clearall-killed-items: '<g:#FFD27A:#FF8C1A>Cleared &f%amount% <g:#FFD27A:#FF8C1A>item stacks.'
command-clearall-killed-all: '<g:#FFD27A:#FF8C1A>Cleared &f%entityAmount% <g:#FFD27A:#FF8C1A>entity stacks and &f%itemAmount% <g:#FFD27A:#FF8C1A>item stacks.'

# Stats Command
command-stats-description: 'Shows plugin stats'
command-stats-header: '<g:#FFAA00:#FF4500>Stacker stats'
command-stats-threads: '<g:#FFD27A:#FF8C1A>» Stacking threads: &f%amount%'
command-stats-stacked-entities: '<g:#FFD27A:#FF8C1A>» Entity stacks: &f%stackAmount% <g:#FFD27A:#FF8C1A>with &f%total% <g:#FFD27A:#FF8C1A>entities'
command-stats-stacked-items: '<g:#FFD27A:#FF8C1A>» Item stacks: &f%stackAmount% <g:#FFD27A:#FF8C1A>with &f%total% <g:#FFD27A:#FF8C1A>items'
command-stats-stacked-blocks: '<g:#FFD27A:#FF8C1A>» Block stacks: &f%stackAmount% <g:#FFD27A:#FF8C1A>with &f%total% <g:#FFD27A:#FF8C1A>blocks'
command-stats-stacked-spawners: '<g:#FFD27A:#FF8C1A>» Spawner stacks: &f%stackAmount% <g:#FFD27A:#FF8C1A>with &f%total% <g:#FFD27A:#FF8C1A>spawners'
command-stats-active-tasks: '<g:#FFD27A:#FF8C1A>» Active tasks: &f%amount%'

# Translate Command
command-translate-description: 'Translates the stack names'
command-translate-loading: '&#FFD700Downloading the translation data. This can take a moment.'
command-translate-failure: '&#FF5555Could not get the locale data. Try again later.'
command-translate-invalid-locale: '&#FF5555This locale does not exist. Use a valid locale.'
command-translate-spawner-format: '<g:#FFD27A:#FF8C1A>Spawner names do not translate well. Use <g:#FFAA00:#FF4500>/rs translate en_us &f{} Spawner <g:#FFD27A:#FF8C1A>to show "Cow Spawner". &f{} <g:#FFD27A:#FF8C1A>is the mob name.'
command-translate-spawner-format-invalid: '&#FF5555This spawner format is not valid. It must contain {} for the mob name.'
command-translate-success: '&#55FF55Stack names translated.'

